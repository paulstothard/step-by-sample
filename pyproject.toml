[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "step-by-sample"
version = "0.2.0"
description = "Run one command independently for every sample, locally or on Slurm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=14,<15",
  "tomli>=2; python_version < '3.11'",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
step-by-sample = "step_by_sample.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
